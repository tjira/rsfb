name: Bot

on:
  schedule:
    - cron: '0 5,10,15,20 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Bot
        run: cargo build --release

      - name: Run Bot
        env:
          SFGAME_USERNAME: ${{secrets.SFGAME_USERNAME}}
          SFGAME_PASSWORD: ${{secrets.SFGAME_PASSWORD}}
        run: timeout -k 10s 90m ./target/release/rsfb "$SFGAME_USERNAME" "$SFGAME_PASSWORD" --hidden || [ $? -eq 124 ]
