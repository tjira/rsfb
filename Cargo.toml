[package]
name = "rsfb"
version = "0.1.3"
edition = "2024"

[dependencies]
sf-api = { git = "https://github.com/tjira/sf-api.git" }

chrono     =  "0.4"
rand       =  "0.8"
rand_distr =  "0.4"
strum      = "0.28"

[target.'cfg(all())'.dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
